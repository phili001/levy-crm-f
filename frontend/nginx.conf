# CSP del panel, definida UNA vez y reutilizada en cada bloque que la necesita.
#
# Va en un `map` (contexto http — este fichero se incluye desde conf.d, que ya
# está dentro de http) porque `add_header` NO se hereda: en cuanto un `location`
# declara su propio add_header, PIERDE todos los del servidor. Sin la variable
# habría que repetir la cadena entera en cada bloque y acabarían divergiendo.
#
# Qué permite y por qué:
#
#   media-src — la grabación de cada llamada se reproduce desde el dominio de
#   Retell (un <audio src> externo). Sin declararlo hereda default-src 'self' y
#   el navegador BLOQUEA el audio: el reproductor sale pero no suena. Se permite
#   https: (el enlace de Retell puede venir de varios CDNs suyos y, con
#   grabaciones firmadas, el host cambia) más data:/blob: para audio local.
#
#   connect-src — a dónde habla el panel DE VERDAD, repasado sobre el código:
#     1. su propio origen ('self'): /config.js, /sw.js y los assets;
#     2. la API del backend, por https Y por wss — el WebSocket del inbox sale
#        del MISMO host (services/api.ts: apiBaseWs = apiBaseHttp con ws://);
#     3. nada más. Las grabaciones de Retell son un <audio src>, o sea media-src
#        y no connect-src; y la URL del servidor MCP solo se PINTA en el panel de
#        tokens para copiarla a mano, el navegador nunca la llama.
#
#   Por qué `https:` y `wss:` siguen abiertos: el host del backend NO se conoce
#   aquí. Se decide en el ARRANQUE del contenedor (API_BASE_URL → /config.js,
#   ver docker-entrypoint.d/40-app-config.sh) y cada instalación tiene el suyo,
#   así que un fichero estático horneado en la imagen no puede nombrarlo.
#   Apretarlo a un dominio concreto dejaría la app muerta en cualquier
#   despliegue que no fuera ese, y no se vería hasta producción. Con
#   script-src 'self' (sin 'unsafe-inline' ni 'unsafe-eval') el hueco que queda
#   exige antes un XSS, que es justo lo que esa directiva corta.
#
#   Para cerrarlo del todo en una instalación concreta, SIN rebuild: monta un
#   fichero en /etc/nginx/csp.d/ con una SEGUNDA cabecera CSP. El navegador
#   aplica todas las políticas que recibe y se queda con la intersección, así
#   que basta con declarar ahí lo que quieras estrechar:
#     add_header Content-Security-Policy "connect-src 'self' https://api.tudominio.com wss://api.tudominio.com" always;
#   El include de abajo lleva comodín: si el directorio no existe, nginx arranca
#   igual. (Comprobado con `nginx -t` en nginx:1.30-alpine, con y sin la carpeta.)
#
#   img-src — las fotos de perfil de Instagram (la ficha de la cuenta conectada
#   y el avatar de cada conversación) las sirve el CDN de Meta, con host
#   variable: scontent-XXX-N.cdninstagram.com y *.fbcdn.net. Con solo 'self' el
#   navegador las bloqueaba y el panel pintaba el hueco beige / las iniciales de
#   colores, aunque el backend devolvía bien la URL.
#
#   style-src / font-src — index.html carga las tipografías por <link> desde
#   fonts.googleapis.com (la hoja) y fonts.gstatic.com (los ficheros woff2). Son
#   DOS directivas distintas: la hoja es estilo y los ficheros son fuente. Sin
#   las dos, el panel entero renderiza con tipografías de respaldo.
#
#   Los restos de desarrollo `http://localhost:*` / `ws://localhost:*` sí se han
#   acotado: eran un comodín a CUALQUIER puerto del ordenador de quien abre el
#   panel. Se deja solo el puerto del backend de la pila local de
#   docker-compose (8000 — ver docker-compose.yml, VITE_API_BASE_URL por
#   defecto http://localhost:8000), que es lo único que los necesitaba.
map $host $csp_policy {
  default "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; img-src 'self' data: blob: https://*.cdninstagram.com https://*.fbcdn.net; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self' https: wss: http://localhost:8000 ws://localhost:8000 http://127.0.0.1:8000 ws://127.0.0.1:8000;";
}

# Protocolo con el que llegó el navegador. Detrás de Coolify, Traefik termina
# el TLS y habla con este nginx por http: si reenviáramos $scheme, la API
# creería que todo llega por http. Se respeta lo que diga el proxy de delante y
# solo sin él se usa el propio.
map $http_x_forwarded_proto $proxy_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

# Cabecera Connection para los WebSockets (inbox, widget y Custom LLM de
# Retell): "upgrade" solo si el cliente lo pide, para no romper el keep-alive
# del resto de peticiones.
map $http_upgrade $proxy_connection {
  default upgrade;
  ""      "";
}

# Registro de accesos SIN la query string. El formato de la imagen (`main`)
# escribe la URL entera, y por ahí viajan secretos y datos personales: el enlace
# de restablecer la contraseña (`/reset-password?token=…`), el token de sesión
# del widget (`/api/v1/webchat/history?…&token=…`), el ticket del WebSocket del
# inbox y lo que el operador busca en Contactos. El Referer los repite (en las
# peticiones al mismo dominio el navegador lo manda entero), así que también va
# recortado. No vale `$uri`: tras el try_files del panel pasa a /index.html.
map $request_uri $ruta_sin_query {
  "~^(?<ruta>[^?]*)" $ruta;
}

map $http_referer $referer_sin_query {
  default                 "-";
  "~^(?<referer>[^?]+)"   $referer;
}

log_format sin_query '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $ruta_sin_query $server_protocol" $status $body_bytes_sent '
                     '"$referer_sin_query" "$http_user_agent" "$http_x_forwarded_for"';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 25M;

  # Oculta versión de nginx
  server_tokens off;
  access_log /var/log/nginx/access.log sin_query;

  # Cabeceras de seguridad globales.
  #
  # OJO al tocar esto: `add_header` NO es acumulativo entre niveles. Un
  # `location` que declara UN add_header propio se queda SIN estas cinco. Por
  # eso cada bloque de abajo que fija su Cache-Control las repite. Hasta ahora
  # no lo hacía y el resultado era que el documento HTML del panel — el único
  # sitio donde la CSP hace algo — se servía SIN ninguna cabecera de seguridad:
  # `/` cae por try_files en `location = /index.html`, que solo tenía su
  # Cache-Control. Ni CSP, ni X-Frame-Options, ni HSTS.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy $csp_policy always;

  # Punto de extensión para endurecer la CSP por despliegue (ver la cabecera del
  # fichero). Vacío por defecto: el comodín hace que un directorio inexistente
  # no sea un error de arranque. Se repite en cada location por la misma regla
  # de no-herencia de add_header; si solo estuviera aquí, la política extra NO
  # llegaría al documento HTML.
  include /etc/nginx/csp.d/*.conf;

  # El service worker NO debe cachearse de forma agresiva: el navegador lo
  # re-comprueba en cada visita para coger la versión nueva. Service-Worker-Allowed
  # permite el scope raíz. (Coincidencia exacta → tiene prioridad sobre el regex.)
  location = /sw.js {
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $csp_policy always;
    include /etc/nginx/csp.d/*.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/";
    try_files $uri =404;
  }

  # config.js se genera en RUNTIME (URL del backend). NUNCA cachearlo, o tras un
  # cambio de despliegue se quedaría pegada la URL antigua. (Coincidencia exacta
  # → tiene prioridad sobre el regex de assets de abajo.)
  location = /config.js {
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $csp_policy always;
    include /etc/nginx/csp.d/*.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # theme.js pone la clase .dark ANTES del primer paint (ver index.html). Está
  # en un fichero propio porque `script-src 'self'` no admite scripts en línea.
  # No lleva hash en el nombre, así que NO puede cachearse como los assets de
  # /assets/: con `immutable` a un año, quien ya lo tuviera seguiría con la
  # versión vieja tras actualizar. (Coincidencia exacta → gana al regex de
  # abajo.)
  location = /theme.js {
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $csp_policy always;
    include /etc/nginx/csp.d/*.conf;
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }

  # Cache assets agresivo. Repite las cabeceras de seguridad por lo dicho arriba
  # (aquí la que importa de verdad es nosniff, sobre respuestas js/css).
  location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|webp|ico)$ {
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $csp_policy always;
    include /etc/nginx/csp.d/*.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # No cachear el HTML para que el SPA siempre coja el bundle correcto.
  # Este es EL documento: sin repetir aquí las cabeceras, la CSP no se aplicaba
  # a nada (ver la nota del bloque global).
  location = /index.html {
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $csp_policy always;
    include /etc/nginx/csp.d/*.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # Un solo dominio: la API vive detrás de este mismo nginx. El panel, el widget
  # que se incrusta en otras webs, los audios, /health y los tres WebSockets
  # (inbox, widget y Custom LLM de Retell en /api/v1/voice/retell/llm-ws/…)
  # salen del mismo origen, así que la CSP de 'self' los cubre sin listar hosts
  # y la instalación necesita un solo subdominio.
  #
  # El destino va en variable a propósito: con `proxy_pass http://app:8000`
  # literal, nginx resuelve el nombre al ARRANCAR y, si la API aún no existe en
  # la red (o el panel se levanta suelto), se niega a arrancar. Con variable
  # resuelve en cada petición con el DNS interno de Docker; si la API está
  # caída, devuelve 502 en vez de dejar el panel sin servir.
  #
  # Las cabeceras de seguridad de lo que responde la API las pone la API
  # (backend/app/core/security_headers.py), y NO deben sumarse las de aquí: el
  # navegador aplica todas las CSP que recibe, y la del panel (script-src
  # 'self') le tumbaría al callback de OAuth su script con nonce
  # (backend/app/api/oauth.py). Por eso cada bloque declara un add_header
  # VACÍO: nginx no lo envía, pero basta con declararlo para que la location
  # deje de heredar las del servidor (la misma regla de no-herencia de arriba,
  # usada a favor). La CORS del widget la pone el backend y pasa tal cual.
  #
  # X-Forwarded-For se AÑADE, no se pisa: el backend cuenta proxies desde la
  # derecha (TRUSTED_PROXY_COUNT, backend/app/core/ratelimit.py). Detrás de
  # Traefik quedan dos (Traefik + este nginx) → TRUSTED_PROXY_COUNT=2.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://app:8000;

  # ^~: sin él, una ruta de la API que acabe en .png o .js caería en el regex de
  # assets y se buscaría como fichero estático.
  location ^~ /api/ {
    proxy_pass $api_upstream;
    add_header X-Api-Upstream "";
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $proxy_connection;
    # Una llamada de voz o un inbox abierto mantienen el WebSocket una hora.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # Las respuestas del agente llegan por streaming: sin buffer, el primer
    # token se ve cuando sale y no al final.
    proxy_buffering off;
  }

  # Coincidencia exacta: gana al regex de assets (*.js), que la serviría como
  # fichero estático inexistente → 404.
  location = /widget.js {
    proxy_pass $api_upstream;
    add_header X-Api-Upstream "";
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_proto;
    proxy_set_header X-Forwarded-Host $host;
  }

  # ^~ para que el regex de assets no se quede con /audios/x.mp3 ni similares.
  location ^~ /audios/ {
    proxy_pass $api_upstream;
    add_header X-Api-Upstream "";
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_proto;
    proxy_set_header X-Forwarded-Host $host;
  }

  location = /health {
    proxy_pass $api_upstream;
    add_header X-Api-Upstream "";
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_proto;
  }

  # El servidor MCP (backend/app/mcp_server.py) lo sirve la API, así que la URL
  # que se pega en Claude es la del propio CRM: https://<dominio>/mcp. Sin este
  # bloque, /mcp caía en el fallback del panel y devolvía el index.html.
  #
  # /mcp y /mcp/ van tal cual a la API, que atiende las dos: nada de redirigir
  # una a la otra, porque un POST redirigido no llega. Es un regex (y no un
  # `=`) para cubrir las dos con un solo bloque; el de assets de arriba no las
  # toca porque no acaban en extensión.
  #
  # Preparado para Streamable HTTP aunque hoy la API conteste JSON: sin búfer
  # ni caché (un stream SSE se entrega según sale, no al cerrarse), HTTP/1.1
  # con keep-alive hacia la API (Connection vacía, no "close") y espera larga
  # (crear un documento de la base de conocimiento lo indexa en la misma
  # llamada). El tamaño del cuerpo lo acota la propia API.
  location ~ ^/mcp/?$ {
    proxy_pass $api_upstream;
    add_header X-Api-Upstream "";
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
